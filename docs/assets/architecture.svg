<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Dify Production Support Platform Architecture</title>
  <desc id="desc">Architecture with Gateway control plane, Dify AI runtime, business service, separate reviewer credential, data stores and observability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
  </defs>

  <rect width="1600" height="920" fill="url(#bg)"/>
  <text x="70" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Dify Production Support Platform</text>
  <text x="70" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Control plane, AI orchestration and deterministic business state are separated by explicit trust boundaries.</text>

  <rect x="60" y="170" width="240" height="150" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="180" y="225" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#0f172a">Client</text>
  <text x="180" y="260" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" fill="#475569">Demo UI / API Caller</text>
  <text x="180" y="288" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" fill="#64748b">never receives app secrets</text>

  <rect x="390" y="140" width="330" height="225" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="555" y="185" text-anchor="middle" font-family="Segoe UI, Arial" font-size="25" font-weight="700" fill="#1d4ed8">FastAPI Gateway</text>
  <text x="555" y="222" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" fill="#334155">Identity and control boundary</text>
  <text x="425" y="262" font-family="Segoe UI, Arial" font-size="16" fill="#334155">JWT / Dev identity + reviewer role</text>
  <text x="425" y="292" font-family="Segoe UI, Arial" font-size="16" fill="#334155">request_id / trace_id</text>
  <text x="425" y="322" font-family="Segoe UI, Arial" font-size="16" fill="#334155">Redis rate limit + 502/504 mapping</text>

  <rect x="810" y="140" width="350" height="225" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="985" y="185" text-anchor="middle" font-family="Segoe UI, Arial" font-size="25" font-weight="700" fill="#6d28d9">Dify AI Runtime</text>
  <text x="985" y="222" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" fill="#334155">Intent, RAG, grounding and workflow</text>
  <text x="845" y="262" font-family="Segoe UI, Arial" font-size="16" fill="#334155">Intent router + query rewrite</text>
  <text x="845" y="292" font-family="Segoe UI, Arial" font-size="16" fill="#334155">Knowledge retrieval + grounding validator</text>
  <text x="845" y="322" font-family="Segoe UI, Arial" font-size="16" fill="#334155">Fixed tool nodes + HITL branch</text>

  <rect x="1240" y="140" width="290" height="225" rx="22" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="1385" y="185" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#334155">Knowledge Base</text>
  <text x="1385" y="225" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" fill="#334155">Policies</text>
  <text x="1385" y="260" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" fill="#334155">FAQ and manuals</text>
  <text x="1385" y="305" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" fill="#64748b">treated as untrusted evidence</text>

  <rect x="540" y="520" width="520" height="250" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="570" text-anchor="middle" font-family="Segoe UI, Arial" font-size="26" font-weight="700" fill="#0f766e">Business Service</text>
  <text x="800" y="606" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" fill="#334155">Deterministic business state and authorization</text>
  <text x="580" y="650" font-family="Segoe UI, Arial" font-size="17" fill="#334155">Orders · Accounts · Tickets · Audit</text>
  <text x="580" y="686" font-family="Segoe UI, Arial" font-size="17" fill="#334155">Refund state machine</text>
  <text x="580" y="722" font-family="Segoe UI, Arial" font-size="17" fill="#334155">pending_review → approved/rejected → executed</text>
  <text x="580" y="754" font-family="Segoe UI, Arial" font-size="15" fill="#64748b">LLM parameters are revalidated against database state</text>

  <rect x="1150" y="500" width="390" height="270" rx="24" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="1345" y="550" text-anchor="middle" font-family="Segoe UI, Arial" font-size="25" font-weight="700" fill="#c2410c">Human Reviewer</text>
  <text x="1180" y="594" font-family="Segoe UI, Arial" font-size="17" fill="#7c2d12">Separate credential: X-Reviewer-API-Key</text>
  <text x="1180" y="630" font-family="Segoe UI, Arial" font-size="17" fill="#7c2d12">Can approve or reject only</text>
  <text x="1180" y="666" font-family="Segoe UI, Arial" font-size="17" fill="#7c2d12">Agent key cannot perform review</text>
  <text x="1180" y="710" font-family="Segoe UI, Arial" font-size="15" fill="#9a3412">Production replacement: OIDC / SSO + RBAC</text>

  <rect x="70" y="500" width="330" height="270" rx="24" fill="#f8fafc" stroke="#94a3b8" filter="url(#shadow)"/>
  <text x="235" y="548" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#334155">Operational Sidecars</text>
  <text x="105" y="596" font-family="Segoe UI, Arial" font-size="17" fill="#475569">PostgreSQL persistence</text>
  <text x="105" y="632" font-family="Segoe UI, Arial" font-size="17" fill="#475569">Redis rate limiting</text>
  <text x="105" y="668" font-family="Segoe UI, Arial" font-size="17" fill="#475569">Prometheus + Grafana</text>
  <text x="105" y="704" font-family="Segoe UI, Arial" font-size="17" fill="#475569">Release gate + evaluation</text>
  <text x="105" y="740" font-family="Segoe UI, Arial" font-size="15" fill="#64748b">Docker Compose + Nginx + CI</text>

  <line x1="300" y1="245" x2="382" y2="245" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="720" y1="245" x2="802" y2="245" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1160" y1="245" x2="1232" y2="245" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="900" y1="365" x2="900" y2="512" stroke="#047857" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <rect x="820" y="420" width="160" height="34" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="900" y="443" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#047857">X-Tool-API-Key</text>

  <line x1="1150" y1="635" x2="1070" y2="635" stroke="#b91c1c" stroke-width="4" marker-end="url(#arrowRed)"/>
  <rect x="1058" y="586" width="112" height="34" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="1114" y="609" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#b91c1c">review only</text>

  <path d="M 540 645 C 455 645, 455 410, 555 365" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
  <path d="M 1055 645 C 1125 645, 1125 385, 1050 365" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>

  <rect x="70" y="830" width="1460" height="54" rx="14" fill="#0f172a"/>
  <text x="800" y="864" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" fill="#f8fafc">Security invariant: AI may propose a high-risk action, but only a separately authenticated reviewer and deterministic business state can authorize execution.</text>
</svg>