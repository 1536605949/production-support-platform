	# ══════════════════════════════════════════════════════════════════════
	# 生产级电商客服平台（support stack）
	#
	# 这一段被插入到共享边缘 nginx 的 443 server 块中，位置在 `location /`
	# 之前。nginx 的 prefix location 按最长匹配取胜，所以 /support/ 会优先于
	# / 命中，不会影响原有站点。
	#
	# 为什么这样接：本机 80/443 只有一个属主，而安全组只放行 22/80/443。
	# 所以 TLS 继续由这一层终结，/support/ 转给本项目的 Caddy（应用层反代），
	# 由 Caddy 再去分流 API 与静态页。
	# ══════════════════════════════════════════════════════════════════════

	# /support 不带斜杠时补一个 301。
	# 前端用的是相对路径（api/chat），只有落在 /support/ 下才会解析成
	# /support/api/chat；少一个斜杠就会打到隔壁站点的 location /。
	location = /support {
		return 301 /support/;
	}

	location /support/ {
		# 末尾的斜杠会把 /support/ 前缀剥掉，Caddy 收到的就是 /api/chat 这类路径。
		proxy_pass         http://support-caddy:8080/;
		proxy_http_version 1.1;

		proxy_set_header Host              $host;
		# 覆盖而不是追加：否则客户端自带的 X-Forwarded-For 会被原样透传，
		# 应用侧按 IP 做的限流就可以被伪造头绕过。
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection        "";

		# ── 对话接口是 SSE 长连接 ──
		# 一次回答可能几十秒；默认 60s 读超时会把连接掐断，表现是"回答到一半
		# 卡住"，而服务端其实还在写。关缓冲、关缓存、超时放到 1 小时。
		proxy_buffering        off;
		proxy_cache            off;
		proxy_read_timeout     3600s;
		proxy_send_timeout     3600s;
		chunked_transfer_encoding on;
		proxy_ignore_client_abort off;
	}

	# 注意：Grafana 与 Prometheus **刻意不**从这里暴露。
	# 它们只在本项目内部网络里监听，通过 SSH 隧道访问即可：
	#   ssh -L 3000:127.0.0.1:3000 ubuntu@124.222.190.3
	# 一个带登录页的运维面板没必要占用公网攻击面。
