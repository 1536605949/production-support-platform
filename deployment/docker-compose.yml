# Production topology for the support platform.
#
#   browser → [shared edge nginx, port 443] → caddy (this file) → gateway (SSE)
#                                                            → business-service
#                                                            ↘ postgres / redis
#
# Two things are deliberate:
#
# 1. Only ``caddy`` is reachable from the shared edge network. Postgres, Redis
#    and both Python services live on a private network with no host port, so a
#    mistake in the edge config cannot expose a database.
# 2. The edge network is declared ``external`` and joined by name. That means
#    this stack does not need to own ports 80/443 — which on this host are
#    already taken by another project — and the other project does not need to
#    know anything about our internals beyond one upstream hostname.

name: support

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 768m
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 192m
    logging: *logging

  business-service:
    build:
      context: ..
      dockerfile: business_service/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
    image: support-business:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: ${DATABASE_URL}
      TOOL_API_KEY: ${TOOL_API_KEY}
      REVIEWER_API_KEY: ${REVIEWER_API_KEY}
      REVIEWER_ID: ${REVIEWER_ID}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["9000"]
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 384m
    logging: *logging

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
    image: support-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENGINE_MODE: ${ENGINE_MODE:-builtin}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:-1}
      AUTO_SEED: ${AUTO_SEED:-1}
      # Connection pool. /api/chat/stream holds a session for the whole SSE
      # response, so these bound how many concurrent streams one worker serves.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_IDLE_TX_TIMEOUT_MS: ${DB_IDLE_TX_TIMEOUT_MS:-300000}
      AUTH_MODE: ${AUTH_MODE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-720}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE}
      TENANT_DAILY_MESSAGE_QUOTA: ${TENANT_DAILY_MESSAGE_QUOTA}
      CORS_ORIGINS: ${CORS_ORIGINS}
      BUSINESS_SERVICE_URL: ${BUSINESS_SERVICE_URL}
      TOOL_API_KEY: ${TOOL_API_KEY}
      # Used only to relay a human approval into the business service's own
      # review state machine. Without it an approval is recorded here and never
      # reaches the order system, so the refund silently never executes.
      REVIEWER_API_KEY: ${REVIEWER_API_KEY}
      REVIEWER_ID: ${REVIEWER_ID}
      INTENT_LLM_THRESHOLD: ${INTENT_LLM_THRESHOLD:-0.55}
      INTENT_HANDOFF_THRESHOLD: ${INTENT_HANDOFF_THRESHOLD:-0.35}
      KNOWLEDGE_TOP_K: ${KNOWLEDGE_TOP_K:-4}
      LLM_ENABLED: ${LLM_ENABLED:-0}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-800}
      # DeepSeek V4 defaults to thinking mode, which spends the completion
      # budget on reasoning_content before emitting an answer — see
      # gateway/app/config.py for why this platform disables it.
      # Forwarded explicitly on purpose: a variable that is not listed here
      # never reaches the container, so setting it in .env alone would silently
      # do nothing.
      LLM_THINKING: ${LLM_THINKING:-disabled}
      LLM_PRICE_IN_PER_1K: ${LLM_PRICE_IN_PER_1K:-0}
      LLM_PRICE_IN_CACHED_PER_1K: ${LLM_PRICE_IN_CACHED_PER_1K:-0}
      LLM_PRICE_OUT_PER_1K: ${LLM_PRICE_OUT_PER_1K:-0}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-0}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: ["8000"]
    # ``internal`` only: the gateway must not be reachable from the shared edge
    # network directly. Caddy bridges the two networks.
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 768m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # ``--watch`` is not cosmetic. The Caddyfile is a bind mount, so editing it
    # does not change the container's config hash and Compose will not recreate
    # anything; without file watching the new config simply never takes effect
    # and the running proxy silently keeps the old routes.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile",
              "--adapter", "caddyfile", "--watch"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../demo_client:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [gateway]
    # Only the edge network needs to reach Caddy, but it also has to reach the
    # gateway, so it joins both.
    #
    # The ``support-caddy`` alias is load-bearing: the shared edge nginx is
    # configured with ``proxy_pass http://support-caddy:8080/`` and resolves
    # that name once, at config-load time. Without an explicit alias the
    # container would only answer to ``caddy`` and ``support-caddy-1``, and the
    # edge nginx would refuse to start.
    networks:
      internal: {}
      edge:
        aliases:
          - support-caddy
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *logging

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    # Loopback only: reachable through an SSH tunnel, never from the internet.
    ports: ["127.0.0.1:9090:9090"]
    networks: [internal]
    depends_on: [alertmanager]
    deploy:
      resources:
        limits:
          memory: 320m
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    # Alertmanager has **no environment-variable expansion** — there is no
    # ``--config.expand-env`` flag (that one is Loki's, and copying it here
    # fails with ``unknown long flag`` and a restart loop). So the webhook URL
    # is handed to the config through ``url_file``: this entrypoint writes the
    # URL, validates the config with ``amtool``, and only then execs.
    #
    # ``amtool check-config`` is the point of doing it in a shell. A monitoring
    # component that starts with a config it could not load is worse than one
    # that refuses to start, because the first is silent.
    #
    # ``--cluster.listen-address=`` disables the HA gossip port: with a single
    # replica there are no peers to gossip with, and leaving it enabled just
    # prints a warning into the log every few seconds.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        printf '%s' "$$ALERT_WEBHOOK_URL" > /tmp/alertmanager-webhook-url
        amtool check-config /etc/alertmanager/alertmanager.yml
        exec /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager \
          --cluster.listen-address=
    environment:
      # Default is a reserved, non-resolvable TLD (RFC 2606) chosen on purpose:
      # it parses as a valid URL so the config validates, and when an alert
      # actually fires the delivery error reads "no such host
      # alert-webhook-not-configured.invalid" — which names the problem, unlike
      # a 405 from a loopback address. Set this to a WeCom/DingTalk/Feishu bot
      # URL to receive notifications for real.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://alert-webhook-not-configured.invalid/}
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    # Loopback only: reachable through an SSH tunnel, never from the internet.
    ports: ["127.0.0.1:9093:9093"]
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 96m
    logging: *logging

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Address and port are separate settings. Putting "0.0.0.0:3000" in
      # GF_SERVER_HTTP_ADDR makes Grafana treat the whole string as a hostname,
      # fail DNS lookup, and restart-loop with
      #   `listen tcp: lookup 0.0.0.0:3000: no such host`.
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # One mount covers datasources, the dashboard provider *and* the dashboard
      # JSON. A second mount targeting a directory that does not exist in the
      # image fails on overlayfs ("read-only file system") while Docker tries to
      # create the mountpoint.
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    # Loopback only: reachable through an SSH tunnel, never from the internet.
    ports: ["127.0.0.1:3000:3000"]
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 320m
    logging: *logging

networks:
  internal:
    driver: bridge
  edge:
    external: true
    name: novel-agents_web

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
  grafana_data:
