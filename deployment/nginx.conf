events {}
http {
  upstream gateway_upstream { server gateway:8000; }
  upstream business_upstream { server business-service:9000; }
  server {
    listen 80;
    client_max_body_size 2m;
    location /api/ { proxy_pass http://gateway_upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /tool-api/ { proxy_pass http://business_upstream/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /metrics { proxy_pass http://gateway_upstream/metrics; }
    location /demo/ { alias /usr/share/nginx/html/demo/; try_files $uri $uri/ /demo/index.html; }
    location = / { return 302 /demo/; }
  }
}
