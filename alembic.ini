# Alembic configuration for the support platform.
#
# One database, two services. The gateway and the business service share a
# single PostgreSQL database (and therefore a single schema history), so there
# is exactly one migration tree here rather than one per service — two trees
# writing to the same database would fight over ``alembic_version``.
#
# Why this exists at all: the services previously created their schema with
# ``Base.metadata.create_all()``, which only ever *creates*. Adding a column to
# a model changed nothing on a database that already had the table — the column
# simply never appeared, the query failed at runtime, and the cause was a silent
# no-op rather than an error. ``create_all`` is still used for throwaway
# databases (tests, a fresh local run); anything that already holds data is
# migrated with ``alembic upgrade head``.

[alembic]
script_location = migrations

# Resolve app packages from the repo root (``gateway``, ``business_service``).
prepend_sys_path = .
# Without this, alembic falls back to legacy splitting on spaces/commas/colons
# and emits a DeprecationWarning on every invocation.
path_separator = os

# Deliberately blank: migrations/env.py reads DATABASE_URL through the same
# ``get_settings()`` the services use. A URL written here would be a second
# source of truth and would drift from the one the app actually connects with.
sqlalchemy.url =

# Revision ids are chosen explicitly (``--rev-id 0002_analytics_indexes``) rather
# than being random hex, so a human reading a deploy log can tell which migration
# ran and a script can reference the baseline without guessing.
#
# The filename is the revision id and nothing else. alembic's stock template is
# ``%(rev)s_%(slug)s``, which with a descriptive rev-id duplicates itself —
# ``0002_analytics_indexes_analytics_indexes.py`` — and gives the same change two
# names to remember. Since ``scripts/new_migration.sh`` derives the rev-id from
# the description, one name is enough.
#
# Note there is no ``.py`` here: alembic appends the extension to whatever this
# template expands to. Writing ``%(rev)s.py`` produces ``0002_foo.py.py`` — which
# is not a Python module, so the next ``alembic upgrade`` cannot find the
# revision it just wrote.
#
# (``0001_baseline_baseline_schema.py`` predates this and keeps its filename;
# it is referenced by that name in tests/test_migrations.py.)
file_template = %%(rev)s

# Store timestamps in UTC so a migration written on a laptop in one timezone
# and applied on a server in another is ordered consistently.
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
